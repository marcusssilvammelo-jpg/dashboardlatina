name: Atualizar dashboard

on:
  schedule:
    - cron: "0 9 * * *"        # 06:00 America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      BITRIX24_WEBHOOK_URL: ${{ secrets.BITRIX24_WEBHOOK_URL }}
      DASH_USER: ${{ secrets.DASH_USER }}
      DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
      ACTIONS_URL: https://github.com/${{ github.repository }}/actions/workflows/update.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Extrair do Bitrix24
        run: |
          python dump_curriculos.py
          python dump_history.py
          python dump_talentos.py
          python dump_vagas.py
          python dump_vagas_history.py
      - name: Geocodificar endereços novos (cache versionado)
        run: python geocode.py
      - name: Montar e criptografar
        run: |
          python build.py
          python encrypt.py
      - name: Versionar cache de geocodificação
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add geocache.json
          git diff --cached --quiet || git commit -m "chore: atualiza geocache" && git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
